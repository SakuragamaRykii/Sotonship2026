[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubber"
version = "0.1.0"
description = "Local, reversible PII and secret scrubber for LLM prompts"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "faker>=24.0",
    "gliner>=0.2.13",
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7,<3.9",
    "streamlit>=1.36",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
ollama = ["ollama>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
scrubber = "cli:app"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["scrubber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the GLiNER model or spaCy model downloaded",
]
